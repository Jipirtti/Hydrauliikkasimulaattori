  Lisenssi: Creative Commons Nimeä 4.0 Kansainvälinen (CC BY 4.0), https://creativecommons.org/licenses/by/4.0/deed.fi
  Saat kopioida, jakaa ja muokata ohjelmaa mihin tahansa tarkoitukseen, kunhan mainitset
  tekijän ja oppilaitoksen, merkitset lisenssin ja kerrot tekemistäsi muutoksista.

<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hydrauliikkasimulaattori</title>
<meta name="author" content="Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK)">
<meta name="copyright" content="Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK), 2026. CC BY 4.0">
<link rel="license" href="https://creativecommons.org/licenses/by/4.0/deed.fi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#DCE3E9; --paper:#F7F9FA; --grid:#E2E8ED; --grid2:#D3DBE2; --panel:#EDF1F4; --ink:#17212B; --muted:#56636F;
  --line:#C2CBD3; --acc:#E39B17; --acc-ink:#7A4F00; --sel:#1E5DBA; --ok:#2E8B57; --warn:#C0392B; --oil:#E3A93A;
  --tint:rgba(227,155,23,.13);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419; --paper:#131A20; --grid:#1A232B; --grid2:#222D36; --panel:#161F26; --ink:#E2E8EE; --muted:#93A0AC;
    --line:#2A3540; --acc:#F0A82A; --acc-ink:#F6C268; --sel:#6FA7FF; --ok:#4CC38A; --warn:#FF6B5B; --oil:#C98E25;
    --tint:rgba(240,168,42,.12);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419; --paper:#131A20; --grid:#1A232B; --grid2:#222D36; --panel:#161F26; --ink:#E2E8EE; --muted:#93A0AC;
  --line:#2A3540; --acc:#F0A82A; --acc-ink:#F6C268; --sel:#6FA7FF; --ok:#4CC38A; --warn:#FF6B5B; --oil:#C98E25;
  --tint:rgba(240,168,42,.12);
}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:1px}

.app{height:100%;display:grid;grid-template-columns:222px minmax(0,1fr) 316px;grid-template-rows:auto minmax(0,1fr) 210px;
  grid-template-areas:"bar bar bar" "pal stage insp" "pal scope insp"}
.bar{grid-area:bar;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:6px}
.brand strong{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;font-weight:600}
.brand span{font-size:13px;color:var(--muted)}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langsw button{border:0;background:var(--paper);padding:5px 12px;cursor:pointer;font-size:14px;font-weight:600}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;min-height:34px}
.btn:hover{border-color:var(--muted)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:118px}
.btn.on{background:var(--acc);border-color:var(--acc);color:#1E1404}
.btn.danger{color:var(--warn)}
select{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-height:34px}
.mini{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.time{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px;font-variant-numeric:tabular-nums;min-width:96px}

.pal{grid-area:pal;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px 8px 20px}
.pal h3{font-size:13px;font-weight:600;color:var(--muted);margin:12px 4px 6px}
.pal h3:first-child{margin-top:2px}
.copy a,.mcopy a{color:inherit}
.copy{font-size:11.5px;line-height:1.35;color:var(--muted);margin:14px 4px 0;padding-top:10px;border-top:1px solid var(--line)}
.mcopy{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
.pitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:4px 8px 4px 4px;margin:0 0 5px;cursor:grab;touch-action:none;user-select:none;font-size:14px;line-height:1.15}
.pitem:hover{border-color:var(--acc)}
.pitem svg{width:46px;height:34px;flex:none;color:var(--ink)}
.ghost{position:fixed;pointer-events:none;z-index:50;background:var(--paper);border:1px solid var(--acc);border-radius:8px;padding:4px 10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}

.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;color:var(--ink);user-select:none;-webkit-user-select:none}
.tools{position:absolute;left:10px;top:10px;z-index:5;display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;max-width:calc(100% - 20px)}
.tools button{border:0;background:transparent;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tools .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.tools label{display:flex;align-items:center;gap:5px;font-size:14px;padding:0 8px;color:var(--muted)}
.status{position:absolute;left:10px;right:10px;bottom:8px;z-index:5;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end;pointer-events:none}
.legendp{pointer-events:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.legendp .grad{width:120px;height:9px;border-radius:5px;background:linear-gradient(90deg,#4A7FD0,#38AA96 30%,#E2BA2E 55%,#E87A2E 78%,#D23B2E)}
.legendp select{min-height:26px;padding:1px 4px;font-size:13px}
.warns{pointer-events:auto;font-size:13px;display:flex;flex-direction:column;gap:3px;max-width:520px}
.warns div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:3px 8px}
.warns div.info{border-left-color:var(--sel)}
.tip{position:absolute;z-index:20;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap;display:none;font-variant-numeric:tabular-nums}

.insp{grid-area:insp;overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:12px 14px 30px}
.insp h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:600;margin:0 0 2px}
.insp h3{font-size:14px;font-weight:600;margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.insp p{margin:0 0 8px;color:var(--muted)}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.ih input{width:86px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:600;background:transparent;border:1px solid transparent;border-radius:6px;padding:0 4px}
.ih input:hover,.ih input:focus{border-color:var(--line);background:var(--paper)}
.tn{color:var(--muted);font-size:14px}
.fld{display:grid;grid-template-columns:1fr 128px;gap:8px;align-items:center;margin:0 0 6px;font-size:14px}
.fld .inp{display:flex;align-items:center;gap:4px}
.fld input,.fld select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:30px;font-variant-numeric:tabular-nums}
.fld em{font-style:normal;color:var(--muted);font-size:12.5px;min-width:34px}
.der{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0;font-size:14px}
.der dt{color:var(--muted)}
.der dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.seg3{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg3 button{border:0;background:var(--paper);padding:6px 14px;cursor:pointer;min-width:44px}
.seg3 button+button{border-left:1px solid var(--line)}
.seg3 button[aria-pressed="true"]{background:var(--acc);color:#1E1404;font-weight:600}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.rng{width:100%;accent-color:var(--acc)}
.help .res{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:6px 0;font-size:14px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.kbd{font-size:12.5px;color:var(--muted)}

.scope{grid-area:scope;border-top:1px solid var(--line);background:var(--panel);overflow:auto;padding:8px 12px}
.scope .sh{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.scope .sh strong{font-size:15px}
.scope .sh span{font-size:13px;color:var(--muted)}
.prow{display:grid;grid-template-columns:150px minmax(0,1fr) 28px;gap:10px;align-items:center;margin-bottom:6px}
.prow .pl{font-size:13px;line-height:1.2}
.prow .pl b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.prow canvas{width:100%;height:50px;display:block;background:var(--paper);border:1px solid var(--line);border-radius:6px}
.prow button{border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;height:28px}
.empty{color:var(--muted);font-size:14px;margin:4px 0}

.modal{position:fixed;inset:0;background:rgba(10,15,20,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}
.mbox h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;margin:0 0 8px}
.mbox h3{font-size:15px;margin:14px 0 4px}
.mbox p{margin:0 0 8px;max-width:70ch}
.mbox textarea{width:100%;height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:flex-end}

/* SVG */
.sy{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.syf{fill:var(--paper);stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.fi{fill:currentColor}
.dash{stroke-dasharray:4 3}
.solon{fill:var(--acc);stroke:currentColor;stroke-width:1.8}
.spin{fill:none;stroke:var(--acc);stroke-width:2.4;stroke-dasharray:5 5}
.oil{fill:var(--oil);opacity:.55}
.ndl{stroke:var(--warn);stroke-width:2;stroke-linecap:round}
.ldb{fill:var(--grid2);stroke:currentColor;stroke-width:1.6}
.ldf{stroke:var(--sel);stroke-width:2.2;fill:none}
.ldfh{fill:var(--sel)}
.sym{fill:currentColor;font:600 14px "Barlow",system-ui,sans-serif}
.hit{fill:transparent;stroke:none}
.comp{cursor:move}
.wh{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.wb{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.wf{fill:none;stroke:rgba(255,255,255,.9);stroke-width:1.8;stroke-dasharray:6 10;stroke-linecap:round}
.wire.selw .wb{stroke-width:6}
.selr{fill:none;stroke:var(--sel);stroke-width:1.5;stroke-dasharray:5 4}
.port{fill:var(--paper);stroke:currentColor;stroke-width:1.5;cursor:crosshair}
.port.con{fill:currentColor}
.port:hover{stroke:var(--sel);stroke-width:3}
.pt{fill:var(--muted);font:500 10px "Barlow",system-ui,sans-serif;pointer-events:none}
.lt{fill:currentColor;font:600 12.5px "Barlow",system-ui,sans-serif;pointer-events:none}
.rt{fill:var(--muted);font:500 12px "Barlow",system-ui,sans-serif;pointer-events:none;font-variant-numeric:tabular-nums}
.probe{cursor:grab}
.probe rect{fill:var(--paper);stroke-width:1.8}
.probe text{font:600 12.5px "Barlow",system-ui,sans-serif;fill:currentColor;font-variant-numeric:tabular-nums}
.probe line{stroke-width:1.3;stroke-dasharray:3 2}
#tmpWire{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:5 4;pointer-events:none}

@media (max-width:900px){
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto auto 64vh auto auto;
    grid-template-areas:"bar" "pal" "stage" "scope" "insp"}
  .pal{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .pal h3,.pal .copy{display:none}
  .pitem{width:auto;flex:none;margin:0;touch-action:pan-x}
  .insp{border-left:0;border-top:1px solid var(--line)}
  .scope{max-height:none}
}
@media (prefers-reduced-motion:reduce){.wf{stroke-dasharray:none;opacity:.35}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><strong data-en="Hydraulics Simulator">Hydrauliikkasimulaattori</strong><span>Juho Pirttilahti, SEAMK 2026, CC BY 4.0</span></div>
    <div class="langsw" role="group" aria-label="Kieli / Language"><button type="button" data-lang="fi" lang="fi">FI</button><button type="button" data-lang="en" lang="en">EN</button></div>
    <div class="grp">
      <button class="btn pri" id="runBtn" type="button">Pysäytä</button>
      <button class="btn" id="resetBtn" type="button" title="Paineet nollaan, sylinterit alkuasemaan" data-en-title="Pressures to zero, cylinders to start position" data-en="Reset state">Nollaa tila</button>
      <label class="mini"><span data-en="Speed">Nopeus</span>
        <select id="speed"><option value="1">1×</option><option value="0.5" data-en="0.5×">0,5×</option><option value="0.2" data-en="0.2×">0,2×</option><option value="0.1" data-en="0.1×">0,1×</option></select>
      </label>
      <span class="time" id="simTime">t = 0,00 s</span>
    </div>
    <div class="grp">
      <select id="exSel" aria-label="Esimerkkipiirit" data-en-aria="Example circuits">
        <option value="" data-en="Example circuits…">Esimerkkipiirit…</option>
        <option value="ex1" data-en="1. Double-acting cylinder, 4/3 valve">1. Kaksitoiminen sylinteri, 4/3-venttiili</option>
        <option value="ex2" data-en="2. Meter-out speed control">2. Nopeudensäätö poistopuolelta (meter-out)</option>
        <option value="ex3" data-en="3. Hydraulic motor and flow meter">3. Hydraulimoottori ja virtausmittari</option>
        <option value="ex4" data-en="4. Single-acting vertical cylinder, controlled lowering">4. Yksitoiminen pystysylinteri, hallittu lasku</option>
      </select>
      <button class="btn" id="undoBtn" type="button" title="Ctrl+Z" data-en="Undo">Kumoa</button>
      <button class="btn" id="ioBtn" type="button" data-en="Save / load">Tallenna / lataa</button>
      <button class="btn" id="fitBtn" type="button" data-en="Fit view">Sovita näkymä</button>
      <button class="btn danger" id="clearBtn" type="button" data-en="Clear">Tyhjennä</button>
      <button class="btn" id="helpBtn" type="button" data-en="Help">Ohje</button>
      <a class="btn" id="manualLink" href="https://jipirtti.github.io/Hydrauliikkasimulaattori/docs/kayttoohje.html" target="_blank" rel="noopener" data-en="Manual (FI)">Käyttöohje</a>
    </div>
  </header>

  <aside class="pal" id="pal" aria-label="Komponentit" data-en-aria="Components"></aside>

  <main class="stage" id="stage">
    <div class="tools" role="toolbar" aria-label="Työkalut" data-en-aria="Tools">
      <button type="button" data-tool="sel" aria-pressed="true" title="V"><span data-en="Select and connect">Valitse ja kytke</span></button>
      <button type="button" data-tool="p" aria-pressed="false" title="Klikkaa liitäntää" data-en-title="Click a port"><i class="sw" style="background:#D23B2E"></i><span data-en="Pressure">Paine</span></button>
      <button type="button" data-tool="q" aria-pressed="false" title="Klikkaa liitäntää" data-en-title="Click a port"><i class="sw" style="background:#2E8B57"></i><span data-en="Flow">Virtaus</span></button>
      <button type="button" data-tool="F" aria-pressed="false" title="Klikkaa sylinteriä tai moottoria" data-en-title="Click a cylinder or motor"><i class="sw" style="background:#1E5DBA"></i><span data-en="Force">Voima</span></button>
      <button type="button" data-tool="v" aria-pressed="false" title="Klikkaa sylinteriä tai moottoria" data-en-title="Click a cylinder or motor"><i class="sw" style="background:#8E5BD0"></i><span data-en="Speed">Nopeus</span></button>
      <label><input type="checkbox" id="showRead" checked> <span data-en="Readings">Lukemat</span></label>
    </div>
    <svg id="cv" aria-label="Piirtoalusta" data-en-aria="Drawing canvas">
      <defs>
        <pattern id="gridPat" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0H0V20" fill="none" stroke="var(--grid)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect id="gridRect" width="100%" height="100%" fill="url(#gridPat)"/>
      <g id="world">
        <g id="lWires"></g><g id="lComps"></g><g id="lSel"></g><g id="lPorts"></g><g id="lLabels"></g><g id="lProbes"></g>
        <path id="tmpWire" d=""/>
      </g>
    </svg>
    <div class="status">
      <div class="legendp"><span data-en="Pressure">Paine</span><span>0</span><span class="grad"></span>
        <select id="pScale" aria-label="Väriasteikon maksimi" data-en-aria="Colour scale maximum"><option>100</option><option selected>160</option><option>250</option><option>400</option></select><span>bar</span></div>
      <div class="warns" id="warns"></div>
    </div>
    <div class="tip" id="tip"></div>
  </main>

  <aside class="insp" id="insp" aria-label="Ominaisuudet ja mitoitus" data-en-aria="Properties and sizing"></aside>

  <section class="scope" aria-label="Mittaukset" data-en-aria="Measurements">
    <div class="sh"><strong data-en="Measurements">Mittaukset</strong><span id="scopeHint" data-en="Choose a sensor tool and click a port or actuator. The curves show a 10 s history.">Valitse anturityökalu ja klikkaa liitäntää tai toimilaitetta. Käyrät näyttävät 10 s historian.</span></div>
    <div id="probeRows"></div>
  </section>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mbox" id="mbox"></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const NS='http://www.w3.org/2000/svg';
/* ---------- kieli / language ---------- */
let lang=(()=>{try{const u=new URLSearchParams(location.search).get('lang');if(u==='fi'||u==='en')return u;const st=localStorage.getItem('hydsim-lang');if(st==='fi'||st==='en')return st;}catch(e){}
  return (navigator.language||'fi').toLowerCase().startsWith('fi')?'fi':'en';})();
const I18N_MISSING=new Set();
const T=s=>{if(lang!=='en'||s==null||s==='')return s;let e=EN[s];if(e===undefined){const m=/^(.*), (\d+ bar)$/.exec(s);if(m&&EN[m[1]]!==undefined)return EN[m[1]]+', '+m[2];I18N_MISSING.add(s);return s;}return e;};
const tr=(fi,en)=>lang==='en'?en:fi;
const UNIT_EN={'r/min':'rpm','cm³/r':'cm³/rev'};const U=u=>lang==='en'&&UNIT_EN[u]?UNIT_EN[u]:u;

/* ---------- physics constants (SI) ---------- */

const clamp=(x,a,b)=>x<a?a:x>b?b:x, c01=x=>clamp(x,0,1);
const sp=x=>x>30?x:(x<-30?Math.exp(x):Math.log1p(Math.exp(x)));
const sig=x=>1/(1+Math.exp(-clamp(x,-60,60)));
const orif=(dp,A)=>CD*A*Math.sqrt(2/RHO)*dp/Math.pow(dp*dp+DEL*DEL,0.25);
const areaFor=(Qn,dpn)=>(Qn/60000)/(CD*Math.sqrt(2*dpn*1e5/RHO));
const LPM=q=>q*60000, BAR=p=>p/1e5;

function ARW(x1,y1,x2,y2,c='sy',fc='fi'){const a=Math.atan2(y2-y1,x2-x1),h=6.5,w=3.4,bx=x2-h*Math.cos(a),by=y2-h*Math.sin(a),px=-Math.sin(a)*w,py=Math.cos(a)*w;
  return L(x1,y1,bx,by,c)+`<polygon class="${fc}" points="${r1(x2)},${r1(y2)} ${r1(bx+px)},${r1(by+py)} ${r1(bx-px)},${r1(by-py)}"/>`;}
function ZZ(x1,x2,y,a=6,n=4,c='sy'){let p=`${r1(x1)},${r1(y)}`;for(let i=0;i<n;i++){const x=x1+(x2-x1)*(i+0.5)/n;p+=` ${r1(x)},${r1(y+(i%2?a:-a))}`;}return `<polyline class="${c}" points="${p} ${r1(x2)},${r1(y)}"/>`;}

function pcol(p){const b=p/1e5;if(b<-0.3)return '#8E5BD0';const f=c01(b/pScale);
  for(let i=1;i<PST.length;i++){if(f<=PST[i][0]){const[a0,c0]=PST[i-1],[a1,c1]=PST[i],t=(f-a0)/(a1-a0);
    return `rgb(${Math.round(c0[0]+(c1[0]-c0[0])*t)},${Math.round(c0[1]+(c1[1]-c0[1])*t)},${Math.round(c0[2]+(c1[2]-c0[2])*t)})`;}}
  return 'rgb(210,59,46)';}

/* shared component logic */
function dcvFl(c,P,four3){
  const s=c.st.s,ov=0.12,A=areaFor(c.p.Qn,c.p.dpn);
  const oa=c01((s-ov)/(1-ov)),ob=c01((-s-ov)/(1-ov));
  const q={P:0,A:0,B:0,T:0};
  const path=(a,b,o)=>{if(o<=0)return;const f=orif(P(a)-P(b),A*o);q[a]+=f;q[b]-=f;};
  path('P','A',oa);path('B','T',oa);path('P','B',ob);path('A','T',ob);
  if(four3){const oc=c01(1-Math.abs(s)/0.4),t=c.p.center;
    if(t==='tandem')path('P','T',oc);
    else if(t==='avoin'){path('P','T',oc);path('A','T',oc);path('B','T',oc);}
    else if(t==='kelluva'){path('A','T',oc);path('B','T',oc);}}
  const Gl=(c.p.leak/60000)/1e7;const lk=(a,b)=>{const f=Gl*(P(a)-P(b));q[a]+=f;q[b]-=f;};
  lk('P','A');lk('P','B');lk('A','T');lk('B','T');
  return q;
}
function dcvDer(c){return [['Kelan asema',c.st.tg>0?'a (P→A, B→T)':c.st.tg<0?'b (P→B, A→T)':tr('keskiasento','centre position')],
  ['Virtaus P',nf(LPM(qf(c,'P')),1)+' L/min'],['Virtaus A',nf(LPM(qf(c,'A')),1)+' L/min'],['Virtaus B',nf(LPM(qf(c,'B')),1)+' L/min'],
  ['Paineet P / A / B / T',[np(c,'P'),np(c,'A'),np(c,'B'),np(c,'T')].map(p=>nf(BAR(p),0)).join(' / ')+' bar'],
  ['Tehohäviö',nf(lossW(c)/1000,2)+' kW']];}
function setValve(c,tg){c.st.tg=tg;if(sel&&sel.id===c.id)syncValveBtns(c);}
function cylFg(c){return c.p.ori==='pysty'?c.p.m*G:0;}
const cylFact=c=>c.p.Ft==='aktiivi'?c.p.F:0, cylFres=c=>c.p.Fc+(c.p.Ft==='aktiivi'?0:Math.abs(c.p.F));
function cylFh(c,pA,pB){const[AA,AB]=cylA(c);let F=pA*AA-pB*AB-cylFact(c)-cylFg(c);if(c.type==='scyl')F-=c.p.F0+c.p.k*1000*c.st.x;return F;}
function cylPre(c){
  const Fh=cylFh(c,np(c,'A'),c.type==='cyl'?np(c,'B'):0),Lm=c.p.L/1000,x=c.st.x,v=c.st.v,Fs=cylFres(c)*1.25;
  let lock=false;
  if(x<=1e-7&&Fh<=0&&v<=0)lock=true;
  else if(x>=Lm-1e-7&&Fh>=0&&v>=0)lock=true;
  else if(Math.abs(v)<2e-4&&Math.abs(Fh)<=Fs)lock=true;
  c.st.lock=lock;if(lock)c.st.v=0;c.st.v0=c.st.v;
}
function cylMr(c,P,V,dt){
  const v=V();if(c.st.lock)return v*1e4;
  const Fh=cylFh(c,P('A'),c.type==='cyl'?P('B'):0);
  return c.p.m*(v-c.st.v0)/dt-(Fh-c.p.cv*v-cylFres(c)*Math.tanh(v/0.005));
}
function cylPost(c,dt){let v=c.st.lock?0:M.u[c.vi];let x=c.st.x+v*dt;const Lm=c.p.L/1000;
  if(x<0){x=0;if(v<0)v=0;}if(x>Lm){x=Lm;if(v>0)v=0;}c.st.x=x;c.st.v=v;}
function cylDyn(c,single){
  const f=c01(c.st.x/(c.p.L/1000)),xp=-64+112*f,end=xp+143;
  let s=`<rect x="-69" y="-17" width="${r1(xp-3+69)}" height="34" fill="${pcol(np(c,'A'))}" opacity=".5"/>`;
  if(!single)s+=`<rect x="${r1(xp+3)}" y="-17" width="${r1(Math.max(0,66-xp))}" height="34" fill="${pcol(np(c,'B'))}" opacity=".5"/>`;
  else s+=ZZ(xp+3,68,-10,6,Math.max(3,Math.round((65-xp)/9)));

/* ---------- topology & solver ---------- */
function rebuild(){
  for(const c of comps){if(c.nets)for(const pn in c.nets){const i=c.nets[pn];if(M.nets[i])portP[c.id+':'+pn]=M.nets[i].p;}}
  const parent={},keys=[];
  for(const c of comps){c.pn=TY[c.type].ports.map(p=>p.n);for(const pn of c.pn){const k=c.id+':'+pn;parent[k]=k;keys.push(k);}}
  const find=k=>{while(parent[k]!==k){parent[k]=parent[parent[k]];k=parent[k];}return k;};
  for(const w of wires){if(parent[w.a]!==undefined&&parent[w.b]!==undefined){const a=find(w.a),b=find(w.b);if(a!==b)parent[a]=b;}}
  const rIdx={},nets=[];
  for(const k of keys){const r=find(k);if(!(r in rIdx)){rIdx[r]=nets.length;nets.push({ports:[],p:0,cav:false});}nets[rIdx[r]].ports.push(k);}
  for(const n of nets){const ps=n.ports.map(k=>portP[k]).filter(v=>v!==undefined);n.p=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:0;}
  for(const c of comps){c.nets={};for(const pn of c.pn)c.nets[pn]=rIdx[find(c.id+':'+pn)];}
  let idx=nets.length;const h=[];for(let i=0;i<nets.length;i++)h.push(20);
  for(const c of comps){if(TY[c.type].mech){c.vi=idx++;h.push(TY[c.type].mech==='lin'?1e-5:1e-3);}else c.vi=-1;
    c.eq=c.pn.map(pn=>c.nets[pn]);if(c.vi>=0)c.eq.push(c.vi);c.deps=[...new Set(c.eq)];c.q=c.q||{};}
  const nU=idx;
  M={nets,nU,h,u:new Float64Array(nU),R:new Float64Array(nU),b:new Float64Array(nU),C:new Float64Array(nets.length),pOld:new Float64Array(nets.length),
     J:Array.from({length:nU},()=>new Float64Array(nU))};
}
function evalC(c,dt){
  const t=TY[c.type],u=M.u;const P=n=>u[c.nets[n]];const V=()=>u[c.vi];
  const q=t.fl?t.fl(c,P,V):null;const out=new Array(c.eq.length);
  for(let i=0;i<c.pn.length;i++)out[i]=q?(q[c.pn[i]]||0):0;
  if(c.vi>=0)out[c.pn.length]=t.mr(c,P,V,dt);
  return out;
}
function assemble(dt){
  const nN=M.nets.length,nU=M.nU,u=M.u,R=M.R,J=M.J;
  R.fill(0);for(let i=0;i<nU;i++)J[i].fill(0);
  for(let k=0;k<nN;k++){R[k]+=M.C[k]*(u[k]-M.pOld[k])/dt;J[k][k]+=M.C[k]/dt;}
  for(const c of comps){
    const base=evalC(c,dt),eq=c.eq;
    for(let i=0;i<eq.length;i++)R[eq[i]]+=base[i];
    for(const j of c.deps){const h=M.h[j],o=u[j];u[j]=o+h;const pe=evalC(c,dt);u[j]=o;
      for(let i=0;i<eq.length;i++)J[eq[i]][j]+=(pe[i]-base[i])/h;}
  }
}
function gauss(A,b,n){
  for(let i=0;i<n;i++){let m=0;const r=A[i];for(let j=0;j<n;j++){const v=Math.abs(r[j]);if(v>m)m=v;}if(m>0){for(let j=0;j<n;j++)r[j]/=m;b[i]/=m;}}
  for(let k=0;k<n;k++){
    let p=k,m=Math.abs(A[k][k]);for(let i=k+1;i<n;i++){const v=Math.abs(A[i][k]);if(v>m){m=v;p=i;}}
    if(m<1e-300)return false;
    if(p!==k){const t=A[p];A[p]=A[k];A[k]=t;const tb=b[p];b[p]=b[k];b[k]=tb;}
    const Ak=A[k],piv=Ak[k];
    for(let i=k+1;i<n;i++){const Ai=A[i],f=Ai[k]/piv;if(f!==0){for(let j=k;j<n;j++)Ai[j]-=f*Ak[j];b[i]-=f*b[k];}}
  }
  for(let k=n-1;k>=0;k--){let s=b[k];const Ak=A[k];for(let j=k+1;j<n;j++)s-=Ak[j]*b[j];b[k]=s/Ak[k];}
  return true;
}
let numErr=false,sampleT=0;
function stepSim(dt){
  const nN=M.nets.length,nU=M.nU,u=M.u;
  for(const c of comps){const t=TY[c.type];if(t.pre)t.pre(c,dt);}
  M.C.fill(0);
  for(const c of comps){const t=TY[c.type];for(const pn of c.pn)M.C[c.nets[pn]]+=(VPORT+(t.vol?t.vol(c,pn):0))/BETA;}
  for(let k=0;k<nN;k++){M.pOld[k]=M.nets[k].p;u[k]=M.nets[k].p;}
  for(const c of comps)if(c.vi>=0)u[c.vi]=c.type==='motor'?c.st.w:c.st.v;
  const saved=Float64Array.from(u);
  for(let it=0;it<8;it++){
    assemble(dt);const b=M.b;for(let i=0;i<nU;i++)b[i]=-M.R[i];
    if(!gauss(M.J,b,nU))break;
    let mp=0,mv=0;
    for(let i=0;i<nN;i++){const d=clamp(b[i],-1e7,1e7);u[i]+=d;mp=Math.max(mp,Math.abs(d));}
    for(let i=nN;i<nU;i++){u[i]+=b[i];mv=Math.max(mv,Math.abs(b[i]));}
    if(mp<30&&mv<1e-7)break;
  }
  for(let i=0;i<nU;i++)if(!Number.isFinite(u[i])){u.set(saved);numErr=true;for(const n of M.nets)n.p=0;return;}
  for(const c of comps){const e=evalC(c,dt);for(let i=0;i<c.pn.length;i++)c.q[c.pn[i]]=e[i];}
  for(let k=0;k<nN;k++){const p=u[k];M.nets[k].cav=p<PFLOOR;M.nets[k].p=Math.max(p,PFLOOR);}
  for(const c of comps){const t=TY[c.type];if(t.post)t.post(c,dt);}
  simT+=dt;
  if(simT-sampleT>=0.02){sampleT=simT;for(const pr of probes){const v=probeVal(pr);pr.buf.push([simT,v]);while(pr.buf.length&&pr.buf[0][0]<simT-10)pr.buf.shift();}}
}

/* ---------- geometry ---------- */
function rotP(x,y,r){switch(((r%360)+360)%360){case 90:return[-y,x];case 180:return[-x,-y];case 270:return[y,-x];default:return[x,y];}}
function portsW(c){return TY[c.type].ports.map(p=>{const[x,y]=rotP(p.x,p.y,c.rot),[dx,dy]=rotP(p.d[0],p.d[1],c.rot);
  return {n:p.n,x:c.x+x,y:c.y+y,d:[Math.round(dx),Math.round(dy)],k:c.id+':'+p.n,c};});}
function bbW(c){const b=TY[c.type].bb,a=rotP(b[0],b[1],c.rot),d=rotP(b[2],b[3],c.rot);
  return [c.x+Math.min(a[0],d[0]),c.y+Math.min(a[1],d[1]),c.x+Math.max(a[0],d[0]),c.y+Math.max(a[1],d[1])];}
function portByKey(k){const[id,pn]=k.split(':');const c=byId[id];if(!c)return null;return portsW(c).find(p=>p.n===pn)||null;}
function route(p1,p2){
  const s1={x:p1.x+p1.d[0]*14,y:p1.y+p1.d[1]*14},s2={x:p2.x+p2.d[0]*14,y:p2.y+p2.d[1]*14};
  const mx=(s1.x+s2.x)/2,my=(s1.y+s2.y)/2;
  const cands=[[{x:s2.x,y:s1.y}],[{x:s1.x,y:s2.y}],[{x:mx,y:s1.y},{x:mx,y:s2.y}],[{x:s1.x,y:my},{x:s2.x,y:my}]];
  let best=null,bc=Infinity;
  for(const mid of cands){const pts=[p1,s1,...mid,s2,p2];let cost=0,pd=null;
    for(let i=1;i<pts.length;i++){const dx=pts[i].x-pts[i-1].x,dy=pts[i].y-pts[i-1].y,l=Math.abs(dx)+Math.abs(dy);if(l<0.5)continue;
      const d=[Math.sign(dx),Math.sign(dy)];if(pd&&d[0]===-pd[0]&&d[1]===-pd[1])cost+=1000;cost+=l;if(pd&&(d[0]!==pd[0]||d[1]!==pd[1]))cost+=6;pd=d;}
    if(cost<bc){bc=cost;best=pts;}}
  const out=[best[0]];for(let i=1;i<best.length;i++){const a=out[out.length-1],p=best[i];if(Math.abs(p.x-a.x)+Math.abs(p.y-a.y)>0.5)out.push(p);}
  return 'M'+out.map(p=>`${r1(p.x)},${r1(p.y)}`).join('L');
}

  if(pr.kind==='p'){const[id,pn]=pr.target.split(':');return {n:'Paine',u:'bar',lab:`${byId[id]?.label}.${pn}`,d:1};}

function probeVal(pr){

function wireFlows(){
  const inj={},adj={};
  for(const c of comps)for(const pn of c.pn){const k=c.id+':'+pn;inj[k]=-qf(c,pn);adj[k]=[];}
  for(const w of wires){w.f=NaN;if(adj[w.a]&&adj[w.b]){adj[w.a].push(w);adj[w.b].push(w);}}
  const deg={},done=new Set(),queue=[];
  for(const k in adj){deg[k]=adj[k].length;if(deg[k]===1)queue.push(k);}
  while(queue.length){const v=queue.pop();if(deg[v]!==1)continue;const w=adj[v].find(x=>!done.has(x.id));if(!w)continue;
    done.add(w.id);const u=w.a===v?w.b:w.a;w.f=(w.a===v?1:-1)*inj[v];inj[u]+=inj[v];deg[v]--;deg[u]--;if(deg[u]===1)queue.push(u);}
}

/* ---------- render loop ---------- */
let lastTs=null,acc=0,frame=0;
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(ts){
  const fdt=lastTs===null?0:Math.min(0.1,(ts-lastTs)/1000);lastTs=ts;
  if(running&&M.nU>0){acc+=fdt*speed;let n=0;while(acc>=DT&&n<120){stepSim(DT);acc-=DT;n++;}if(n>=120)acc=0;}
  render(fdt);requestAnimationFrame(loop);
}
function render(fdt){
  frame++;
  for(const c of comps){const t=TY[c.type];if(t.dyn){const s=t.dyn(c);if(s!==c.dyS){c.dyEl.innerHTML=s;c.dyS=s;}}}
  wireFlows();
  for(const w of wires){if(!w.bp)continue;const pa=portByKey(w.a);const c=pa&&pa.c;const p=c?np(c,pa.n):0;w.bp.setAttribute('stroke',pcol(p));
    const Q=LPM(w.f);if(Number.isFinite(Q)&&Math.abs(Q)>0.03){w.fp.style.opacity=1;if(running&&!reduce){w.off-=Math.sign(Q)*Math.min(90,12+32*Math.log10(1+Math.abs(Q)))*fdt*speed;w.fp.style.strokeDashoffset=r1(w.off);}}
    else w.fp.style.opacity=0;}
  if(frame%3===0)for(const c of comps){c.rt.textContent=showRead&&TY[c.type].read?TY[c.type].read(c):'';}
  updateProbeTags();
  if(frame%2===0)drawScope();
  if(frame%10===0)updDer();
  if(frame%20===0)updWarns();
  $('#simTime').textContent=`t = ${nf(simT,2)} s`;
}

let lastWarnCodes=[];
function updWarns(){
  const out=[];
  if(numErr){out.push([tr('Numeerinen virhe, paineet nollattiin. Tarkista kytkennät.','Numerical error, pressures were reset. Check the connections.'),'','numeerinen']);}
  const hasPRV=comps.some(c=>c.type==='prv');
  for(const c of comps){const t=TY[c.type];
    const lim=c.p.pmax||c.p.pr;if(lim){const pm=Math.max(...c.pn.map(pn=>np(c,pn)));if(pm>lim*1e5*1.02)out.push([tr(`${c.label}: paine ${nf(BAR(pm),0)} bar ylittää sallitun ${lim} bar`,`${c.label}: pressure ${nf(BAR(pm),0)} bar exceeds the rated ${lim} bar`),'','ylipaine']);}
    if(c.type==='pump'&&c.st.on&&np(c,'S')<-0.4e5)out.push([tr(`${c.label}: pumppu ei saa öljyä. Kytke imuliitäntä S säiliöön.`,`${c.label}: the pump is starved of oil. Connect suction port S to a tank.`),'','imu']);
  }
  if(M.nets.some(n=>n.cav))out.push([tr('Alipaine (kavitaatio) piirissä. Tarkista imu- ja paluulinjat tai kuorman jarrutus.','Vacuum (cavitation) in the circuit. Check the suction and return lines or how the load is braked.'),'','kavitaatio']);
  if(!hasPRV&&comps.some(c=>c.type==='pump'&&c.p.kind==='vakio')&&M.nets.some(n=>n.p>350e5))out.push([tr('Paine karkaa: vakiotilavuuspumppu tarvitsee paineenrajoitusventtiilin.','Pressure runaway: a fixed displacement pump needs a pressure relief valve.'),'','karkaa']);
  if(!comps.length)out.push([tr('Vedä komponentteja vasemmalta piirtoalustalle tai valitse esimerkkipiiri.','Drag components from the left onto the canvas or load an example circuit.'),'info','tyhja']);
  else if(!wires.length)out.push([tr('Kytke komponentit vetämällä liitännästä toiseen.','Connect components by dragging from one port to another.'),'info','kytke']);
  lastWarnCodes=out.map(o=>o[2]);$('#warns').innerHTML=out.slice(0,4).map(([s,c])=>`<div class="${c}">${esc(s)}</div>`).join('');
}

function ser(){return JSON.stringify({v:1,comps:comps.map(c=>({id:c.id,type:c.type,x:c.x,y:c.y,rot:c.rot,label:c.label,p:c.p})),
  wires:wires.map(w=>({a:w.a,b:w.b})),probes:probes.map(p=>({kind:p.kind,target:p.target,dx:p.dx,dy:p.dy}))});}
function load(json,fit=true){
  const d=typeof json==='string'?JSON.parse(json):json;if(!d||!Array.isArray(d.comps))throw new Error('Tiedostosta puuttuu komponenttilista.');
  lC.innerHTML='';lL.innerHTML='';comps=[];byId={};wires=[];probes=[];sel=null;nextId=1;portP={};
  for(const c of d.comps){if(!TY[c.type])continue;const n=parseInt(String(c.id).slice(1))||0;nextId=Math.max(nextId,n+1);addComp(c.type,c.x,c.y,c.p,{id:c.id,rot:c.rot,label:c.label});}
  for(const w of d.wires||[])if(portByKey(w.a)&&portByKey(w.b))wires.push({id:'w'+(nextId++),a:w.a,b:w.b});
  (d.probes||[]).forEach((p,i)=>{const ok=(p.kind==='p'||p.kind==='q')?portByKey(p.target):byId[p.target];if(ok)probes.push({id:'pr'+(nextId++),kind:p.kind,target:p.target,dx:p.dx??26,dy:p.dy??-30,color:PCOL[i%PCOL.length],buf:[]});});
  resetStates();syncAll();renderProbesDom();buildInsp();if(fit)fitView();
}

function doUndo(){if(!undo.length)return;const s=undo.pop();load(s,false);save();}

function fitView(){
  const r=cv.getBoundingClientRect();if(!comps.length){view.k=1;view.tx=r.width/2;view.ty=r.height/2;applyView();return;}
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;for(const c of comps){const b=bbW(c);x0=Math.min(x0,b[0]);y0=Math.min(y0,b[1]);x1=Math.max(x1,b[2]+(TY[c.type].mech==='lin'?60:0));y1=Math.max(y1,b[3]);}
  for(const pr of probes){const pt=probeTargetPt(pr);if(pt){x0=Math.min(x0,pt.x+pr.dx);y0=Math.min(y0,pt.y+pr.dy-14);x1=Math.max(x1,pt.x+pr.dx+110);}}
  const padT=64,padB=56,padX=40;const k=clamp(Math.min((r.width-2*padX)/(x1-x0+80),(r.height-padT-padB)/(y1-y0+80)),0.35,1.6);
  view.k=k;view.tx=(r.width-(x1+x0)*k)/2;view.ty=padT+((r.height-padT-padB)-(y1+y0)*k)/2;applyView();
}

  ['Mittarit',[['gauge','Painemittari',{}],['flowm','Virtausmittari',{}]]]
];
function buildPalette(){
  const el=$('#pal');let h='';
  PAL.forEach(([cat,items],ci)=>{h+=`<h3>${T(cat)}</h3>`;items.forEach(([type,name,p],ii)=>{
    const t=TY[type],fake={type,p:Object.assign({},t.def,p),st:null};fake.st=t.init(fake);const b=t.bb;
    const vb=`${b[0]-6} ${b[1]-6} ${b[2]-b[0]+12} ${b[3]-b[1]+12}`;
    h+=`<button type="button" class="pitem" data-pi="${ci}:${ii}" title="${tr('Vedä alustalle tai klikkaa','Drag onto the canvas or click')}"><svg viewBox="${vb}" aria-hidden="true">${t.draw(fake)}${t.dyn?t.dyn(fake):''}</svg><span>${T(name)}</span></button>`;});});
  h+=`<p class="copy">${tr('Tekijä','Author')}: Juho Pirttilahti, ${tr('Seinäjoen ammattikorkeakoulu','Seinäjoki University of Applied Sciences')} (SEAMK), 2026.<br>${tr('Suunnittelu, sisältö ja validointi: Juho Pirttilahti. Ohjelmakoodi toteutettu tekoälyavusteisesti (Claude, Anthropic).','Design, content and validation: Juho Pirttilahti. Code implemented with AI assistance (Claude, Anthropic).')}<br>${tr('Lisenssi','Licence')}: <a href="https://creativecommons.org/licenses/by/4.0/deed.fi" target="_blank" rel="license noopener">CC BY 4.0</a></p>`;
  el.innerHTML=h;
}

/* ---------- pointer interaction ---------- */
let drag=null;const tip=$('#tip');
function nearestPort(w,maxD=16){let best=null,bd=maxD;for(const c of comps)for(const p of portsW(c)){const d=Math.hypot(p.x-w.x,p.y-w.y);if(d<bd){bd=d;best=p;}}return best;}
function localPt(c,w){const dx=w.x-c.x,dy=w.y-c.y;return rotP(dx,dy,-c.rot);}
cv.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.pointerType==='mouse')return;
  const w=toWorld(e),t=e.target;
  const prEl=t.closest&&t.closest('.probe'),portEl=t.closest&&t.closest('[data-port]'),compEl=t.closest&&t.closest('.comp'),wireEl=t.closest&&t.closest('.wire');
  cv.setPointerCapture(e.pointerId);
  if(prEl){const pr=probes.find(p=>p.id===prEl.dataset.pr);drag={k:'probe',pr,sx:e.clientX,sy:e.clientY,dx:pr.dx,dy:pr.dy};return;}
  if(tool!=='sel'){placeProbe(w,portEl,compEl,wireEl);drag={k:'none'};return;}
  if(portEl){const p=portByKey(portEl.dataset.port);drag={k:'wire',from:p};tmpW.setAttribute('d',`M${p.x},${p.y}L${w.x},${w.y}`);return;}
  if(compEl){const c=byId[compEl.dataset.id];sel={id:c.id};renderSel();buildInsp();
    const t2=TY[c.type];const[lx]=localPt(c,w);const h=t2.hit?t2.hit(c,lx):null;
    if(h&&t2.press&&c.p.mode==='jousi'){t2.press(c,h);drag={k:'mom',c};return;}
    drag={k:'move',c,sx:e.clientX,sy:e.clientY,ox:c.x,oy:c.y,hit:h,moved:false};return;}
  if(wireEl){sel={w:wireEl.dataset.w};renderSel();buildInsp();drag={k:'none'};return;}
  sel=null;renderSel();buildInsp();drag={k:'pan',sx:e.clientX,sy:e.clientY,tx:view.tx,ty:view.ty};
});
cv.addEventListener('pointermove',e=>{
  if(!drag){hoverTip(e);return;}
  tip.style.display='none';
  if(drag.k==='pan'){view.tx=drag.tx+e.clientX-drag.sx;view.ty=drag.ty+e.clientY-drag.sy;applyView();}
  else if(drag.k==='move'){const dx=(e.clientX-drag.sx)/view.k,dy=(e.clientY-drag.sy)/view.k;
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4){drag.moved=true;snapshot();}
    if(drag.moved){drag.c.x=Math.round((drag.ox+dx)/10)*10;drag.c.y=Math.round((drag.oy+dy)/10)*10;placeComp(drag.c);renderPorts();renderWires();renderSel();}}
  else if(drag.k==='wire'){const w=toWorld(e);const p=nearestPort(w,14);const tx=p?p.x:w.x,ty=p?p.y:w.y;tmpW.setAttribute('d',`M${drag.from.x},${drag.from.y}L${tx},${ty}`);}
  else if(drag.k==='probe'){drag.pr.dx=drag.dx+(e.clientX-drag.sx)/view.k;drag.pr.dy=drag.dy+(e.clientY-drag.sy)/view.k;}
});
function endDrag(e){
  if(!drag)return;
  if(drag.k==='wire'){const w=toWorld(e);const p=nearestPort(w,14);if(p&&p.k!==drag.from.k)addWire(drag.from.k,p.k);tmpW.setAttribute('d','');}
  if(drag.k==='move'){if(drag.moved)save();else if(drag.hit){const t=TY[drag.c.type];if(t.click)t.click(drag.c,drag.hit);}}
  if(drag.k==='mom'){const t=TY[drag.c.type];t.release(drag.c);}
  if(drag.k==='probe')save();
  drag=null;
}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerleave',()=>{tip.style.display='none';});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  const k2=clamp(view.k*Math.exp(-e.deltaY*0.0015),0.3,3);view.tx=mx-(mx-view.tx)*k2/view.k;view.ty=my-(my-view.ty)*k2/view.k;view.k=k2;applyView();},{passive:false});
function hoverTip(e){
  const t=e.target,stage=$('#stage').getBoundingClientRect();let s='';
  const portEl=t.closest&&t.closest('[data-port]'),wireEl=t.closest&&t.closest('.wire');
  if(portEl){const p=portByKey(portEl.dataset.port);if(p){const q=LPM(qf(p.c,p.n));s=`${p.c.label}.${p.n}: p ${nf(BAR(np(p.c,p.n)),1)} bar, Q ${nf(q,2)} L/min ${q>=0?tr('sisään','in'):tr('ulos','out')}`;}}
  else if(wireEl){const w=wires.find(x=>x.id===wireEl.dataset.w);const a=w&&portByKey(w.a);if(a)s=`p ${nf(BAR(np(a.c,a.n)),1)} bar`+(Number.isFinite(w.f)?`, Q ${nf(Math.abs(LPM(w.f)),2)} L/min`:'');}
  if(!s){tip.style.display='none';return;}
  tip.textContent=s;tip.style.display='block';tip.style.left=(e.clientX-stage.left+14)+'px';tip.style.top=(e.clientY-stage.top+14)+'px';
}
function placeProbe(w,portEl,compEl,wireEl){
  let port=null,comp=null;
  if(portEl)port=portByKey(portEl.dataset.port);
  else if(wireEl){const wi=wires.find(x=>x.id===wireEl.dataset.w);const a=portByKey(wi.a),b=portByKey(wi.b);port=Math.hypot(a.x-w.x,a.y-w.y)<Math.hypot(b.x-w.x,b.y-w.y)?a:b;}
  else if(compEl){comp=byId[compEl.dataset.id];}
  if(tool==='p'||tool==='q'){if(!port&&comp){port=portsW(comp).reduce((a,p)=>Math.hypot(p.x-w.x,p.y-w.y)<Math.hypot(a.x-w.x,a.y-w.y)?p:a);}if(port)addProbe(tool,port.k);return;}
  if(!comp&&port)comp=port.c;
  if(comp&&['cyl','scyl','motor'].includes(comp.type))addProbe(tool,comp.id);
  else flashWarn(tool==='F'?tr('Voima-anturi kiinnitetään sylinteriin tai moottoriin.','The force sensor attaches to a cylinder or motor.'):tr('Nopeusanturi kiinnitetään sylinteriin tai moottoriin.','The speed sensor attaches to a cylinder or motor.'));
}
function flashWarn(s){const el=$('#warns');el.innerHTML=`<div class="info">${esc(s)}</div>`;}

/* palette drag */
let pdrag=null;
$('#pal').addEventListener('pointerdown',e=>{const b=e.target.closest('.pitem');if(!b)return;e.preventDefault();
  const[ci,ii]=b.dataset.pi.split(':').map(Number);const it=PAL[ci][1][ii];pdrag={it,sx:e.clientX,sy:e.clientY,ghost:null};b.setPointerCapture(e.pointerId);});
$('#pal').addEventListener('pointermove',e=>{if(!pdrag)return;if(!pdrag.ghost&&Math.hypot(e.clientX-pdrag.sx,e.clientY-pdrag.sy)>5){const g=document.createElement('div');g.className='ghost';g.textContent=pdrag.it[1];document.body.appendChild(g);pdrag.ghost=g;}
  if(pdrag.ghost){pdrag.ghost.style.left=(e.clientX+10)+'px';pdrag.ghost.style.top=(e.clientY+10)+'px';}});
function palDrop(e){if(!pdrag)return;const[type,,p]=pdrag.it;const r=cv.getBoundingClientRect();
  if(pdrag.ghost){pdrag.ghost.remove();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){snapshot();const w=toWorld(e);placeNew(type,w.x,w.y,p);}}
  else if(e.type==='pointerup'){snapshot();const n=comps.length%6;placeNew(type,(r.width/2-view.tx)/view.k+n*30,(r.height/2-view.ty)/view.k+n*30,p);}
  pdrag=null;}
function placeNew(type,x,y,p){const c=addComp(type,x,y,p);sel={id:c.id};rebuild();syncAll();buildInsp();save();}
$('#pal').addEventListener('pointerup',palDrop);$('#pal').addEventListener('pointercancel',e=>{if(pdrag&&pdrag.ghost)pdrag.ghost.remove();pdrag=null;});

document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea'))return;
  if($('#modal').classList.contains('open')){if(e.key==='Escape')closeModal();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();doUndo();return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSel();}
  else if(e.key==='r'||e.key==='R')rotateSel();
  else if(e.key===' '){e.preventDefault();setRun(!running);}
  else if(e.key==='Escape'){setTool('sel');tmpW.setAttribute('d','');drag=null;}
  else if(e.key==='v'||e.key==='V')setTool('sel');
});

$('#helpBtn').addEventListener('click',()=>openModal(tr(`<h2>Ohje</h2>
<p>Täydellinen käyttöohje esimerkkeineen ja harjoitustehtävineen: <a href="https://jipirtti.github.io/Hydrauliikkasimulaattori/docs/kayttoohje.html" target="_blank" rel="noopener">Hydrauliikkasimulaattorin käyttöohje</a>.</p>
<h3>Piirin rakentaminen</h3><p>Vedä komponentti vasemmalta piirtoalustalle tai klikkaa sitä, jolloin se ilmestyy näkymän keskelle. Kytke letku vetämällä liitännästä toiseen. Haaran saat kytkemällä samaan liitäntään useamman letkun. Kytkemätön liitäntä toimii tulppana.</p>
<h3>Ohjaus</h3><p>Suuntaventtiiliä ohjataan klikkaamalla sen kelaa: vasen kela vaihtaa asentoon a (P→A, B→T), oikea asentoon b (P→B, A→T). Jousipalautteinen venttiili pysyy asennossa vain niin kauan kuin painat. Pumpun saa pysäytettyä klikkaamalla sähkömoottoria M tai ominaisuuspaneelista.</p>
<h3>Mittaukset</h3><p>Valitse työkaluriviltä Paine tai Virtaus ja klikkaa liitäntää. Voima- ja nopeusanturi kiinnitetään sylinteriin tai moottoriin (moottorilla voima-anturi näyttää väännön). Anturien lukemat näkyvät piirroksessa ja käyrinä alapaneelissa. Virtauksen etumerkki: positiivinen virtaa komponenttiin sisään. Viemällä hiiren liitännän tai letkun päälle näet hetkellisen paineen ja virtauksen.</p>
<h3>Mitoitus</h3><p>Valitse komponentti, niin oikeassa paneelissa voit muuttaa sen mitoitusarvoja ja näet lasketut suureet. Mitoitusapu laskee esimerkiksi sylinterin halkaisijan tarvittavasta voimasta ja ehdottaa vakiokokoa.</p>
<h3>Malli ja rajoitukset</h3><p>Paineet ratkaistaan implisiittisesti öljyn kokoonpuristuvuuden (tehollinen puristuvuusmoduuli 1,2 GPa) ja kuristusyhtälön Q = Cd·A·√(2Δp/ρ) avulla, aika-askel 1 ms. Sylinterissä on massa, kitka ja vasteet; moottorissa hitausmomentti ja kuormitusmomentti. Malli on opetuskäyttöön tarkoitettu yksinkertaistus: letkujen painehäviöitä, lämpenemistä, viskositeetin muutosta ja venttiilien dynaamista ohjausta ei mallinneta, joten tulokset kuvaavat ilmiöitä mutta eivät korvaa järjestelmätoimittajan mitoituslaskelmia.</p>
<p class="mcopy">Tekijä: Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK), 2026. Suunnittelu, sisältö ja validointi: Juho Pirttilahti. Ohjelmakoodi toteutettu tekoälyavusteisesti (Claude, Anthropic). Ohjelma on lisensoitu <a href="https://creativecommons.org/licenses/by/4.0/deed.fi" target="_blank" rel="license noopener">Creative Commons Nimeä 4.0 Kansainvälinen -lisenssillä (CC BY 4.0)</a>. Saat kopioida, jakaa ja muokata sitä mihin tahansa tarkoitukseen, kunhan mainitset tekijän ja oppilaitoksen, merkitset lisenssin ja kerrot tekemistäsi muutoksista.</p>
`,`<h2>Help</h2>
<p>Full user manual with examples and exercises (in Finnish): <a href="https://jipirtti.github.io/Hydrauliikkasimulaattori/docs/kayttoohje.html" target="_blank" rel="noopener">Hydraulics simulator user manual</a>.</p>
<h3>Building a circuit</h3><p>Drag a component from the left onto the canvas, or click it to place it in the middle of the view. Connect a hose by dragging from one port to another. Connect several hoses to the same port to make a branch. An unconnected port acts as a plug.</p>
<h3>Operating</h3><p>Operate a directional valve by clicking its solenoid: the left solenoid shifts to position a (P→A, B→T), the right one to position b (P→B, A→T). A spring-return valve stays shifted only while you hold the mouse button. Stop a pump by clicking its electric motor M or from the properties panel.</p>
<h3>Measurements</h3><p>Choose Pressure or Flow on the toolbar and click a port. Force and speed sensors attach to a cylinder or motor (on a motor the force sensor shows torque). Sensor readings appear on the drawing and as curves in the bottom panel. Flow sign: positive flows into the component. Hover over a port or hose to see the instantaneous pressure and flow.</p>
<h3>Sizing</h3><p>Select a component to edit its sizing parameters and see calculated values in the right-hand panel. The sizing helper calculates, for example, the cylinder bore needed for a given force and suggests a standard size.</p>
<h3>Model and limitations</h3><p>Pressures are solved implicitly from oil compressibility (effective bulk modulus 1.2 GPa) and the orifice equation Q = Cd·A·√(2Δp/ρ) with a 1 ms time step. Cylinders have mass, friction and end stops; motors have inertia and load torque. The model is a teaching simplification: hose pressure losses, heating, viscosity changes and valve control dynamics are not modelled, so the results illustrate the phenomena but do not replace a system supplier's sizing calculations.</p>

/* ---------- kielen vaihto / language switching ---------- */
function applyStatic(){
  document.querySelectorAll('[data-en]').forEach(el=>{if(el.dataset.fi===undefined)el.dataset.fi=el.textContent;el.textContent=lang==='en'?el.dataset.en:el.dataset.fi;});
  document.querySelectorAll('[data-en-title]').forEach(el=>{if(el.dataset.fiTitle===undefined)el.dataset.fiTitle=el.getAttribute('title');el.setAttribute('title',lang==='en'?el.dataset.enTitle:el.dataset.fiTitle);});
  document.querySelectorAll('[data-en-aria]').forEach(el=>{if(el.dataset.fiAria===undefined)el.dataset.fiAria=el.getAttribute('aria-label');el.setAttribute('aria-label',lang==='en'?el.dataset.enAria:el.dataset.fiAria);});
  document.documentElement.lang=lang;document.title=lang==='en'?'Hydraulics Simulator':'Hydrauliikkasimulaattori';
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
}
function setLang(l){if(l!=='fi'&&l!=='en')return;lang=l;try{localStorage.setItem('hydsim-lang',l);}catch(e){}
  try{const u=new URL(location.href);if(u.searchParams.has('lang')){u.searchParams.set('lang',l);history.replaceState(null,'',u);}}catch(e){}
  applyStatic();buildPalette();setRun(running);buildInsp();renderProbeRows();if(modal.classList.contains('open'))closeModal();
  for(const c of comps)c.dyS=null;updWarns();}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

/* ---------- test & validation API (used by tests/test_validointi.py) ---------- */
const byLabel=l=>{const c=comps.find(x=>x.label===l);if(!c)throw new Error('Komponenttia ei löydy: '+l);return c;};
window.HydSim={
  version:'1.1.1',
  setLang:l=>{setLang(l);return lang;},
  lang:()=>lang,
  warningCodes:()=>{updWarns();return lastWarnCodes.slice();},
  i18nMissing:()=>[...I18N_MISSING],
  loadExample:k=>{if(!EX[k])throw new Error('Tuntematon esimerkki '+k);load(EX[k],false);setRun(false);return comps.map(c=>c.label);},
  loadCircuit:j=>{load(j,false);setRun(false);return comps.map(c=>c.label);},
  serialize:()=>ser(),
  pause:()=>setRun(false),
  reset:()=>{resetStates();},
  run:sec=>{setRun(false);const n=Math.round(sec/DT);for(let i=0;i<n;i++)stepSim(DT);return simT;},
  time:()=>simT,
  setValve:(l,tg)=>{setValve(byLabel(l),tg);},
  setPump:(l,on)=>{byLabel(l).st.on=!!on;},
  setParam:(l,k,v)=>{const c=byLabel(l);c.p[k]=v;fixParams(c);renderStatic(c);},
  param:l=>({...byLabel(l).p}),
  state:l=>{const c=byLabel(l);const o={};for(const k in c.st)if(typeof c.st[k]!=='object')o[k]=c.st[k];return o;},
  p:(l,port)=>BAR(np(byLabel(l),port)),
  q:(l,port)=>LPM(qf(byLabel(l),port)),
  areas:l=>{const[AA,AB]=cylA(byLabel(l));return {A_mm2:AA*1e6,Aring_mm2:AB*1e6};},
  forceKN:l=>{const c=byLabel(l);const[AA,AB]=cylA(c);return (np(c,'A')*AA-(c.type==='cyl'?np(c,'B')*AB:0))/1000;},
  torqueNm:l=>{const c=byLabel(l);return (np(c,'A')-np(c,'B'))*c.p.Vg*1e-6/(2*Math.PI)*c.p.etahm;},
  rpm:l=>byLabel(l).st.w*60/(2*Math.PI),
  warnings:()=>{updWarns();return [...document.querySelectorAll('#warns div')].map(d=>d.textContent);},
  numericError:()=>numErr
};
