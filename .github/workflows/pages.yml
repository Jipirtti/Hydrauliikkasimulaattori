# Julkaisee simulaattorin GitHub Pagesiin, kun validointi on mennyt läpi main-haarassa.
name: Julkaisu

on:
  workflow_run:
    workflows: ["Validointi"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  julkaise:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rakenna käyttöohjeen HTML-sivu
        run: |
          pip install markdown
          python tools/rakenna_ohje.py
      - name: Kokoa sivusto
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r docs _site/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
