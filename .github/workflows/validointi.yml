# Automaattinen regressiovalidointi: ajetaan jokaisesta muutoksesta ja ajastetusti viikoittain.
name: Validointi

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # maanantaisin klo 04.00 UTC (07.00 Suomen kesäaikaa)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validointi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Asenna testityökalut
        run: |
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Aja validointitestit
        run: python -m pytest tests -v --junitxml=validointi-junit.xml

      - name: Lisää raportti ajon yhteenvetoon
        if: always()
        run: |
          if [ -f validointiraportti.md ]; then cat validointiraportti.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Tallenna raportti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validointiraportti
          path: |
            validointiraportti.md
            validointi-junit.xml

      - name: Avaa issue, jos ajastettu validointi epäonnistui
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Ajastettu validointi epäonnistui';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'validointi'
            });
            if (open.some(i => i.title === title)) return;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, labels: ['validointi', 'fysiikka'],
              body: `Viikoittainen validointiajo epäonnistui.\n\nAjo ja raportti: ${run}\n\nTarkista, mikä ilmiö (V-tunnus) poikkesi käsinlaskusta, ja korjaa joko simulaattori tai testi. Fysiikan muutos vaatii opettajan validoinnin, ks. VALIDOINTI.md.`
            });

  # Julkaisu GitHub Pagesiin samassa ajossa, vain main-haarasta ja vain jos validointi meni läpi.
  # Sivusto kootaan ja ladataan omassa työssään ja julkaistaan erillisessä työssä (GitHubin dokumentoima malli).
  kokoa:
    needs: validointi
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rakenna käyttöohjeen HTML-sivu
        run: |
          pip install markdown
          python tools/rakenna_ohje.py
      - name: Kokoa sivusto
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r docs _site/docs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  julkaise:
    needs: kokoa
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
