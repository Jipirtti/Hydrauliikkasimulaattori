name: Fysiikka ei vastaa odotusta
description: Simulaattorin tulos poikkeaa käsinlaskusta, kirjallisuudesta tai mittauksesta.
title: "[Fysiikka] "
labels: ["fysiikka", "validointi"]
body:
  - type: markdown
    attributes:
      value: Kiitos! Fysiikkahavainnot käsitellään opettajan validoinnissa. Mitä tarkemmin kuvaat laskelman, sitä nopeammin asia ratkeaa.
  - type: input
    id: tunnus
    attributes:
      label: Validointitunnus
      description: Jos havainto liittyy VALIDOINTI.md:n riviin, anna tunnus (esim. V05 tai L03).
  - type: textarea
    id: ilmio
    attributes:
      label: Ilmiö ja tilanne
      description: Mitä teit simulaattorissa, ja mitä tapahtui?
    validations:
      required: true
  - type: textarea
    id: odotus
    attributes:
      label: Odotettu tulos ja perustelu
      description: Kaava, laskelma, lähde tai mittaustulos.
    validations:
      required: true
  - type: textarea
    id: piiri
    attributes:
      label: Piiri JSON-muodossa
      description: Tallenna / lataa -ikkunan teksti. Näin piiri voidaan toistaa täsmälleen.
      render: json
